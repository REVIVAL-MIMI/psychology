databaseChangeLog:
  - changeSet:
      id: 004-psychologist-availability
      author: codex
      changes:
        - createTable:
            tableName: psychologist_availability
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: psychologist_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: work_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: is_working
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: work_start_hour
                  type: INTEGER
              - column:
                  name: work_end_hour
                  type: INTEGER
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: psychologist_availability
            baseColumnNames: psychologist_id
            referencedTableName: psychologists
            referencedColumnNames: id
            constraintName: fk_psychologist_availability_psychologist
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: psychologist_availability
            columnNames: psychologist_id, work_date
            constraintName: uk_psychologist_availability_psychologist_date
        - createIndex:
            tableName: psychologist_availability
            indexName: idx_psychologist_availability_date
            columns:
              - column:
                  name: psychologist_id
              - column:
                  name: work_date
