#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ????????? ????????? ????, ????? ?? ???????????
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
#logging.level.org.springframework.boot.autoconfigure=ERROR
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.data.redis.repositories.enabled=false

# JWT
jwt.secret=mySuperSecretKeyForJWTGenerationWithAtLeast256BitsLengthToBeSecureEnough
# 30 ?????
jwt.access-expiration=1800000
# 7 ????
jwt.refresh-expiration=604800000

# ???????? ????????? ??? ??????
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging
#logging.level.com.psychology=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.web=DEBUG
#logging.level.org.springframework.messaging=DEBUG

# Tomcat
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.tomcat.connection-timeout=60000

# ????????? open-in-view ????? ?????????????? ??????
spring.jpa.open-in-view=false
# ????????? ????????? ??????? ????????
spring.jackson.serialization.fail-on-empty-beans=false

#logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerAdapter=ERROR
#logging.level.org.springframework.web.servlet.FrameworkServlet=WARN

# ???????? ??????? ???????? ??? ?????????? (???????? ??? ????????????)
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ???????? ??????????? ?????
spring.task.scheduling.enabled=true
spring.task.scheduling.pool.size=5

# Demo seed data
app.seed.enabled=true
app.organization.name=ООО «Телеком без границ»
app.psychologists.require-verification=false

# ????????? ??? ????????????
scheduler.session-reminder.enabled=true
scheduler.cleanup.enabled=true

# Admin login (dev only)
admin.login=admin
admin.password=1235

# Telegram OTP delivery
app.telegram.enabled=false
app.telegram.bot-token=
app.telegram.polling.enabled=true
app.telegram.polling.fixed-delay-ms=5000

# Email OTP delivery
app.email-otp.enabled=false
app.email-otp.from=
app.email-otp.subject=Код входа в платформу
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Optional SMTP fallback (useful when provider blocks direct smtp.gmail.com:587 from Docker)
app.email-otp.fallback-host=
app.email-otp.fallback-port=0
app.email-otp.fallback-auth=true
app.email-otp.fallback-starttls-enable=false
app.email-otp.fallback-starttls-required=false
app.email-otp.fallback-ssl-enable=false
app.email-otp.fallback-ssl-trust=
